command_arbiter:
  config:
    profile_id: {type: string, description: Exact profile identity., read_only: true}
    profile_version: {type: string, description: Exact profile version., read_only: true}
    behavior_fingerprint: {type: string, description: Production behavior fingerprint., read_only: true}
    input_selection_fingerprint: {type: string, description: Input selection fingerprint., read_only: true}
    node_config_fingerprint: {type: string, description: Non-circular node fingerprint., read_only: true}
    selected_artifact_ids: {type: string_array, description: Exact artifact identities., read_only: true}
  loop_rate_hz:
    type: double
    description: Steady-clock arbitration rate.
    read_only: true
    validation:
      gt<>: [0.0]
  source_registry_path:
    type: string
    description: Exact installed source-registry artifact path.
    read_only: true
  source_registry_sha256:
    type: string
    description: Expected normalized source-registry hash.
    read_only: true
