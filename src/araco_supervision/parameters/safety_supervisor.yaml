safety_supervisor:
  config:
    profile_id: {type: string, description: Exact profile identity., read_only: true}
    profile_version: {type: string, description: Exact profile version., read_only: true}
    behavior_fingerprint: {type: string, description: Production behavior fingerprint., read_only: true}
    input_selection_fingerprint: {type: string, description: Input selection fingerprint., read_only: true}
    node_config_fingerprint: {type: string, description: Non-circular node fingerprint., read_only: true}
    selected_artifact_ids: {type: string_array, description: Exact artifact identities., read_only: true}
  loop_rate_hz:
    type: double
    description: Steady-clock safety evaluation rate.
    read_only: true
    validation:
      gt<>: [0.0]
  controller_manager_validation_period_s:
    type: double
    description: Period for each staggered typed controller-manager validation request.
    read_only: true
    validation:
      gt<>: [0.0]
  joint_state_topic:
    type: string
    description: Exact joint-state topic selected by versioned wiring.
    read_only: true
    validation:
      not_empty<>: []
  safety_policy_path:
    type: string
    description: Exact installed safety-policy artifact path.
    read_only: true
  safety_policy_sha256:
    type: string
    description: Expected normalized safety-policy hash.
    read_only: true
  state_joint_names:
    type: string_array
    description: Canonical ordered 25-joint state partition.
    read_only: true
  leg_joint_names:
    type: string_array
    description: Canonical ordered 24-joint leg controller partition.
    read_only: true
  gimbal_joint_names:
    type: string_array
    description: Canonical one-joint gimbal controller partition.
    read_only: true
  selected_command_timeout_s:
    type: double
    description: Steady timeout for the trusted selected-command stream.
    read_only: true
    validation:
      gt<>: [0.0]
  joint_state_timeout_s:
    type: double
    description: Steady timeout for the complete canonical joint-state stream.
    read_only: true
    validation:
      gt<>: [0.0]
  locomotion_status_timeout_s:
    type: double
    description: Steady timeout for the locomotion health heartbeat.
    read_only: true
    validation:
      gt<>: [0.0]
  controller_state_timeout_s:
    type: double
    description: Steady timeout for both trajectory-controller state streams.
    read_only: true
    validation:
      gt<>: [0.0]
  clock_progress_timeout_s:
    type: double
    description: Steady timeout for advancing simulation clock samples.
    read_only: true
    validation:
      gt<>: [0.0]
  stable_hold_dwell_s:
    type: double
    description: Required locomotion holding dwell before STOPPING completes.
    read_only: true
    validation:
      gt_eq<>: [0.0]
  startup_readiness_stable_s:
    type: double
    description: Continuous full-readiness dwell required before startup may enter HOLDING.
    read_only: true
    validation:
      gt_eq<>: [0.0]
  auto_enable_once_from_neutral_standing_source:
    type: bool
    description: Automatically authorize one fresh neutral-standing source once per lifecycle activation.
    read_only: true
  body_envelope:
    planar_speed_normal_m_s: {type: double, description: Normal planar speed magnitude., read_only: true}
    planar_speed_hard_m_s: {type: double, description: Hard planar speed magnitude., read_only: true}
    yaw_rate_normal_rad_s: {type: double, description: Normal yaw-rate magnitude., read_only: true}
    yaw_rate_hard_rad_s: {type: double, description: Hard yaw-rate magnitude., read_only: true}
    gimbal_yaw_normal_rad: {type: double, description: Normal gimbal-yaw magnitude., read_only: true}
    gimbal_yaw_hard_rad: {type: double, description: Hard gimbal-yaw magnitude., read_only: true}
    xy_normal_m: {type: double, description: Normal X/Y body-offset magnitude., read_only: true}
    z_normal_lower_m: {type: double, description: Normal lower Z body offset., read_only: true}
    z_normal_upper_m: {type: double, description: Normal upper Z body offset., read_only: true}
    roll_pitch_normal_rad: {type: double, description: Normal roll/pitch magnitude., read_only: true}
    yaw_normal_rad: {type: double, description: Normal posture-yaw magnitude., read_only: true}
    xy_hard_m: {type: double, description: Hard X/Y body-offset magnitude., read_only: true}
    z_hard_lower_m: {type: double, description: Hard lower Z body offset., read_only: true}
    z_hard_upper_m: {type: double, description: Hard upper Z body offset., read_only: true}
    roll_pitch_hard_rad: {type: double, description: Hard roll/pitch magnitude., read_only: true}
    yaw_hard_rad: {type: double, description: Hard posture-yaw magnitude., read_only: true}
    quaternion_norm_tolerance: {type: double, description: Unit-quaternion tolerance., read_only: true}
    reserved_twist_tolerance: {type: double, description: Reserved twist zero tolerance., read_only: true}
    stand_velocity_tolerance: {type: double, description: Stand velocity zero tolerance., read_only: true}
